<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCimage</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23111'/><rect x='4' y='4' width='24' height='24' rx='3' fill='none' stroke='%23888' stroke-width='1.5'/><circle cx='11' cy='12' r='2.5' fill='%23ccc'/><path d='M4 22l7-7 5 5 4-3 8 7v2a3 3 0 01-3 3H7a3 3 0 01-3-3z' fill='%23fff' opacity='.25'/><path d='M28 14l-2-2-2 2' stroke='%23fff' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/><line x1='26' y1='12' x2='26' y2='20' stroke='%23fff' stroke-width='1.5' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #000000;
  --surface: #0a0a0a;
  --border: #1a1a1a;
  --border-hover: #333;
  --text-primary: #ededed;
  --text-secondary: #888;
  --text-tertiary: #666;
  --accent: #ffffff;
  --danger: #e5484d;
  --success: #45a557;
  --radius: 6px;
  --radius-lg: 10px;
  --transition: 150ms ease;
  --panel-ease: cubic-bezier(0.22, 1, 0.36, 1);
  --panel-transition: 520ms var(--panel-ease);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
* { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.15) transparent; }
*::-webkit-scrollbar { width: 6px; height: 6px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
*::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg); color: var(--text-primary);
  min-height: 100vh; -webkit-font-smoothing: antialiased;
}

/* Layout */
.app { display: flex; height: 100vh; }
.panel {
  width: 240px; min-width: 240px;
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden;
  transition: width var(--panel-transition), min-width var(--panel-transition), border-color 280ms ease;
}
.panel.is-collapsed {
  width: 54px;
  min-width: 54px;
}
.panel-inner {
  padding: 18px 10px 12px;
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
  transition: padding var(--panel-transition);
}
.panel.is-collapsed .panel-inner {
  padding: 18px 8px 12px;
}
.panel-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 10px;
}
.panel-header-copy {
  min-width: 0;
  overflow: hidden;
  max-width: 180px;
  transition: max-width var(--panel-transition), opacity 260ms ease, transform var(--panel-transition);
}
.panel.is-collapsed .panel-header {
  justify-content: center;
  margin-bottom: 0;
}
.panel.is-collapsed .panel-header-copy {
  max-width: 0;
  opacity: 0;
  transform: translateX(-10px);
}
.panel-header h1 {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.02em;
  white-space: nowrap;
}
.panel-toggle {
  width: 28px;
  height: 28px;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.02);
  color: var(--text-secondary);
  cursor: pointer;
  transition: transform var(--panel-transition), border-color var(--transition), color var(--transition), background var(--transition);
}
.panel-toggle:hover {
  border-color: var(--border-hover);
  color: var(--text-primary);
  background: rgba(255,255,255,0.06);
}
.panel-toggle svg {
  width: 14px;
  height: 14px;
  display: block;
}
.panel.is-collapsed .panel-toggle {
  transform: rotate(180deg);
}
.panel-body {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  transition: opacity 320ms ease, transform var(--panel-transition), visibility 0s linear 0s;
}
.panel.is-collapsed .panel-body {
  opacity: 0;
  transform: translateX(-14px);
  pointer-events: none;
  visibility: hidden;
  transition: opacity 220ms ease, transform var(--panel-transition), visibility 0s linear 520ms;
}
.connection-card {
  border: 1px solid var(--border); border-radius: var(--radius);
  background: rgba(255,255,255,0.015); margin-bottom: 8px; overflow: hidden;
  min-height: 0;
}
.connection-card summary {
  list-style: none; display: flex; align-items: center; justify-content: space-between;
  gap: 8px; padding: 8px 8px; color: var(--text-secondary);
  font-size: 11px; font-weight: 500; cursor: pointer; user-select: none;
}
.connection-card summary::-webkit-details-marker { display: none; }
.connection-card summary::after {
  content: '⌄'; color: var(--text-tertiary); font-size: 12px;
  transition: transform var(--transition);
}
.connection-card:not([open]) summary::after { transform: rotate(-90deg); }
.connection-card-body {
  height: clamp(180px, 28vh, 220px);
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-gutter: stable;
  padding: 0 8px 8px;
  padding-right: 4px;
}
.workspace-shell {
  display: flex;
  flex: 1;
  min-height: 0;
  flex-direction: column;
  overflow: hidden;
}
.workflow-tabs {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px;
  margin-bottom: 10px;
}
.workflow-tab {
  min-height: 32px;
  padding: 0 6px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: rgba(255,255,255,0.02);
  color: var(--text-tertiary);
  font-family: inherit;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: -0.01em;
  cursor: pointer;
  transition: all var(--transition);
}
.workflow-tab:hover { border-color: var(--border-hover); color: var(--text-secondary); }
.workflow-tab.active {
  border-color: rgba(255,255,255,0.24);
  background:
    radial-gradient(circle at top, rgba(255,255,255,0.08), transparent 58%),
    rgba(255,255,255,0.04);
  color: var(--text-primary);
}
.workflow-tab.is-disabled,
.workflow-tab:disabled {
  opacity: .48;
  cursor: not-allowed;
}
.workspace-card {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background:
    radial-gradient(circle at top right, rgba(255,255,255,0.055), transparent 34%),
    linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.012));
  padding: 10px;
}
.workspace-card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
}
.workspace-card-copy { min-width: 0; }
.workspace-eyebrow {
  color: var(--text-tertiary);
  font-size: 9px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.workspace-title {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.02em;
  margin-top: 3px;
}
.workspace-chip {
  flex-shrink: 0;
  min-height: 22px;
  padding: 0 8px;
  border-radius: 999px;
  border: 1px solid var(--border);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  color: var(--text-secondary);
  background: rgba(255,255,255,0.04);
}
.workspace-chip.is-live {
  border-color: rgba(69,165,87,0.28);
  color: #d6f6dd;
  background: rgba(69,165,87,0.12);
}
.workspace-chip.is-planned {
  border-color: rgba(255,255,255,0.16);
  color: var(--text-secondary);
}
.workspace-stack {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding-right: 4px;
}
.workspace-group {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: rgba(0,0,0,0.28);
  padding: 9px;
}
.workspace-group.mode-hidden { display: none; }
.workspace-group-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}
.workspace-group-title {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-secondary);
}
.workspace-group-hint {
  margin-top: 3px;
  font-size: 10px;
  line-height: 1.45;
  color: var(--text-tertiary);
}
.chip-btn {
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 24px;
  padding: 0 9px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-tertiary);
  font-family: inherit;
  font-size: 10px;
  line-height: 1;
  white-space: nowrap;
  cursor: pointer;
  transition: all var(--transition);
}
.chip-btn:hover,
.chip-btn.is-active {
  border-color: var(--border-hover);
  color: var(--text-primary);
  background: rgba(255,255,255,0.05);
}
.inline-drawer summary {
  list-style: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  cursor: pointer;
  user-select: none;
}
.inline-drawer summary::-webkit-details-marker { display: none; }
.inline-drawer summary span:first-child {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-secondary);
}
.workspace-inline-hint {
  font-size: 10px;
  color: var(--text-tertiary);
}
.inline-drawer {
  margin-top: 8px;
  border-top: 1px solid var(--border);
  padding-top: 8px;
}
.inline-drawer-body {
  margin-top: 8px;
}
.helper-note {
  min-height: 32px;
  padding: 7px 8px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.02);
  color: var(--text-tertiary);
  font-size: 10px;
  line-height: 1.45;
}
/* Gallery area */
.gallery-area {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  padding: 24px;
  position: relative;
}
.gallery-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 16px;
  position: relative;
  flex-shrink: 0;
  z-index: 10;
}
.gallery-header-left { display: flex; align-items: center; gap: 8px; }
.gallery-count { color: var(--text-tertiary); font-size: 12px; }
.gallery-filter { display: flex; gap: 4px; }
.gallery-filter button {
  padding: 4px 12px; border-radius: 100px; font-size: 12px;
  font-family: inherit; cursor: pointer;
  border: 1px solid var(--border); background: transparent;
  color: var(--text-tertiary); transition: all var(--transition);
}
.gallery-filter button:hover { color: var(--text-secondary); border-color: var(--border-hover); }
.gallery-filter button.active { color: var(--text-primary); background: rgba(255,255,255,0.08); border-color: var(--border-hover); }
.gallery-sort-btn {
  padding: 4px 10px; border-radius: 100px; font-size: 11px;
  font-family: inherit; cursor: pointer;
  border: 1px solid var(--border); background: transparent;
  color: var(--text-tertiary); transition: all var(--transition); white-space: nowrap;
}
.gallery-sort-btn:hover { color: var(--text-secondary); border-color: var(--border-hover); }
.gallery-actions-right { display: flex; gap: 8px; align-items: center; }
.gallery-window-shell {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow: hidden;
  border-radius: 22px;
  background:
    radial-gradient(120% 72% at 50% -14%, rgba(255,255,255,0.05), transparent 34%),
    radial-gradient(120% 76% at 50% 114%, rgba(255,255,255,0.03), transparent 38%);
}
.gallery-window {
  position: relative;
  z-index: 1;
  height: 100%;
  overflow-y: auto;
}
.gallery-viewport-content {
  min-height: 100%;
  padding: 8px 8px 28px;
}
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(var(--gallery-columns, 4), minmax(0, 1fr));
  grid-auto-rows: var(--gallery-grid-row-height, 8px);
  gap: var(--gallery-grid-gap, 10px);
  align-items: start;
}
.gallery-grid.grouped-by-task {
  display: block;
}
.gallery-grid.is-virtualized {
  display: block;
  position: relative;
  min-height: var(--gallery-virtual-height, 0);
}
.gallery-grid.is-virtualized .gallery-item {
  margin: 0;
  background: rgba(255,255,255,0.018);
}
.gallery-grid.is-virtualized .gallery-item img,
.gallery-grid.is-virtualized .gallery-item .gallery-preview {
  height: 100%;
  object-fit: cover;
}
.gallery-grid.is-virtualized .gallery-item.is-loading {
  background: rgba(255,255,255,0.018);
}
.gallery-grid.is-virtualized .gallery-item.is-loading::before {
  opacity: 0;
  animation: none;
}
.gallery-grid.is-virtualized .gallery-preview {
  background: rgba(255,255,255,0.018);
}
.gallery-task-section {
  margin: 0 0 18px;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: rgba(255,255,255,0.02);
  content-visibility: auto;
  contain-intrinsic-size: auto 420px;
}
.gallery-task-section-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}
.gallery-task-section-title {
  font-size: 12px;
  line-height: 1.5;
  color: var(--text-primary);
  word-break: break-word;
}
.gallery-task-section-meta {
  font-size: 10px;
  color: var(--text-tertiary);
  white-space: nowrap;
}
.gallery-task-section-grid {
  display: grid;
  grid-template-columns: repeat(var(--gallery-task-columns, 4), minmax(0, 1fr));
  grid-auto-rows: var(--gallery-grid-row-height, 8px);
  gap: var(--gallery-grid-gap, 10px);
  align-items: start;
}

.gallery-item {
  container: gallery / inline-size;
  display: block;
  width: 100%;
  min-height: 0;
  margin: 0;
  position: relative;
  border-radius: 10px;
  overflow: hidden;
  border: none;
  cursor: pointer;
  transition: background var(--transition), box-shadow 180ms ease;
  background: var(--gallery-placeholder-color, rgba(255,255,255,0.02));
  box-shadow:
    0 1px 0 rgba(255,255,255,0.04) inset,
    0 14px 30px rgba(0,0,0,0.18);
}
.gallery-item.has-masonry-profile {
  aspect-ratio: var(--gallery-card-aspect-ratio);
}
.gallery-item.is-featured {
  border-radius: 14px;
  box-shadow:
    0 1px 0 rgba(255,255,255,0.06) inset,
    0 18px 40px rgba(0,0,0,0.24);
}
.gallery-item.is-compact {
  border-radius: 8px;
}
.gallery-item.shape-panorama {
  border-radius: 8px;
}
.gallery-item.shape-portrait,
.gallery-item.shape-tallPortrait {
  border-radius: 12px;
}
.gallery-item.is-loading {
  background:
    linear-gradient(135deg, var(--gallery-placeholder-accent, rgba(255,255,255,0.18)), var(--gallery-placeholder-color, rgba(255,255,255,0.06))),
    var(--gallery-placeholder-color, rgba(255,255,255,0.08));
}
.gallery-item:hover,
.gallery-item:focus-visible {
  background: rgba(255,255,255,0.03);
  box-shadow:
    0 1px 0 rgba(255,255,255,0.08) inset,
    0 20px 46px rgba(0,0,0,0.28);
  outline: none;
}
.gallery-item::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 2;
  background:
    linear-gradient(135deg, rgba(255,255,255,0.22), rgba(255,255,255,0.08) 48%, rgba(255,255,255,0.14)),
    rgba(255,255,255,0.08);
  opacity: 0;
  transition: opacity 180ms ease;
  pointer-events: none;
}
.gallery-item.is-loading::before {
  opacity: 1;
  animation: gallery-shimmer 1.2s ease-in-out infinite;
}
.gallery-item.has-preview.is-loading::before {
  opacity: 0.16;
  animation: none;
  background: rgba(255,255,255,0.08);
}
.gallery-item.is-loaded::before,
.gallery-item.is-error::before { opacity: 0; }
.gallery-item img[data-src] {
  display: block;
  width: 100%;
  position: relative;
  z-index: 1;
  opacity: 0;
  background: rgba(255,255,255,0.02);
  object-fit: cover;
  will-change: opacity;
}
.gallery-item.has-masonry-profile img[data-src] {
  height: 100%;
}
.gallery-item.has-preview img[data-src] {
  background: transparent;
}
.gallery-item img[data-src].is-loaded {
  opacity: 1;
}
.gallery-preview {
  position: absolute;
  inset: 0;
  z-index: 0;
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 1;
  transform: translateZ(0) scale(1.01);
  transition: opacity 160ms ease;
  pointer-events: none;
  background: var(--gallery-placeholder-color, rgba(255,255,255,0.06));
}
.gallery-item.is-loaded .gallery-preview {
  opacity: 0;
}
.gallery-preview.is-error {
  opacity: 0;
}
.gallery-item.is-error img[data-src] {
  opacity: 0.18;
  clip-path: inset(0 0 0 0);
}
.gallery-overlay {
  position: absolute; inset: 0;
  z-index: 3;
  background:
    linear-gradient(180deg, transparent 32%, rgba(0,0,0,0.22) 60%, rgba(0,0,0,0.88)),
    radial-gradient(120% 80% at 50% 100%, rgba(0,0,0,0.28), transparent 64%);
  opacity: 0; transition: opacity var(--transition);
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 11px;
}
.gallery-item:hover .gallery-overlay, .gallery-item:focus-visible .gallery-overlay { opacity: 1; }
.gallery-overlay .prompt-preview {
  font-size: 11px; color: rgba(255,255,255,0.86); line-height: 1.42;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.gallery-overlay .meta-row {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 6px;
  margin-top: 8px;
}
.gallery-overlay .meta-row .time {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 10px;
  line-height: 1.2;
  color: rgba(255,255,255,0.6);
  font-variant-numeric: tabular-nums;
}
.gallery-overlay .meta-row .time-date,
.gallery-overlay .meta-row .time-clock {
  min-width: 0;
  white-space: nowrap;
}
.gallery-overlay .meta-row .time-clock {
  color: rgba(255,255,255,0.78);
}
.gallery-overlay .meta-row a {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  min-height: 24px;
  padding: 4px 8px;
  border-radius: var(--radius-sm);
  font-size: 10px;
  line-height: 1;
  background: rgba(255,255,255,0.16);
  color: #fff;
  text-decoration: none;
  transition: background var(--transition), border-color var(--transition);
}
.gallery-overlay .meta-row a:hover { background: rgba(255,255,255,0.3); }
.gallery-overlay .meta-actions {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 5px;
}
.gallery-overlay .meta-actions button {
  min-width: 0;
  min-height: 24px;
  padding: 4px 6px;
  border-radius: var(--radius-sm);
  font-size: 10px;
  line-height: 1;
  background: rgba(255,255,255,0.16);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.1);
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
  transition: background var(--transition), border-color var(--transition);
}
.gallery-overlay .meta-actions button:hover {
  background: rgba(255,255,255,0.28);
  border-color: rgba(255,255,255,0.18);
}
@container gallery (max-width: 170px) {
  .gallery-overlay .meta-actions {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
.gallery-del-btn, .lightbox-del-btn { background: rgba(229,72,77,0.25) !important; color: #f87171 !important; }
.gallery-del-btn:hover, .lightbox-del-btn:hover { background: rgba(229,72,77,0.45) !important; }
.gallery-empty {
  display: flex; align-items: center; justify-content: center;
  height: 100%; color: var(--text-tertiary); font-size: 14px;
}
@keyframes gallery-shimmer {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 0.9; }
}

/* Form */
.form-group { margin-bottom: 10px; }
label {
  display: block; margin-bottom: 5px; font-weight: 500;
  color: var(--text-secondary); font-size: 10px; letter-spacing: -0.01em;
}
label .hint { color: var(--text-tertiary); font-weight: 400; font-size: 11px; }
input, select, textarea {
  width: 100%; padding: 7px 8px;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); color: var(--text-primary);
  font-size: 11px; font-family: inherit;
  transition: border-color var(--transition); outline: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--border-hover); }
.input-with-action {
  position: relative;
}
.input-with-action input {
  padding-right: 34px;
}
.input-action-btn {
  position: absolute;
  top: 50%;
  right: 7px;
  transform: translateY(-50%);
  width: 22px;
  height: 22px;
  padding: 0;
  border: none;
  background: transparent;
  color: var(--text-tertiary);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: color var(--transition);
}
.input-action-btn:hover { color: var(--text-primary); }
.input-action-btn svg {
  width: 14px;
  height: 14px;
  display: block;
}
.input-action-btn .eye-off-line {
  opacity: 0;
  transition: opacity var(--transition);
}
.input-action-btn.is-active .eye-off-line {
  opacity: 1;
}
.field-hint {
  margin-top: 5px;
  min-height: 15px;
  color: var(--text-tertiary);
  font-size: 10px;
  line-height: 1.45;
}
.field-label-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 5px;
}
.field-label-row label {
  margin-bottom: 0;
}
.field-label-icon-btn {
  width: 18px;
  height: 18px;
  padding: 0;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 999px;
  background: rgba(255,255,255,0.03);
  color: var(--text-tertiary);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition:
    color var(--transition),
    border-color var(--transition),
    background var(--transition);
}
.field-label-icon-btn:hover {
  color: var(--text-primary);
  border-color: rgba(255,255,255,0.14);
  background: rgba(255,255,255,0.06);
}
.field-label-icon-btn:disabled {
  cursor: not-allowed;
  opacity: 0.52;
}
.field-label-icon-btn svg {
  width: 11px;
  height: 11px;
  display: block;
}
.field-label-icon-btn.is-loading svg {
  animation: spin 0.8s linear infinite;
}
.field-hint[data-tone="success"] {
  color: var(--success);
}
.field-hint[data-tone="warning"] {
  color: #d7b46a;
}
.field-hint[data-tone="error"] {
  color: var(--danger);
}
.provider-profile-picker {
  position: relative;
}
.provider-profile-trigger {
  width: 100%;
  padding: 10px 34px 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--text-primary);
  font-family: inherit;
  font-size: 12px;
  line-height: 1.35;
  text-align: left;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
  position: relative;
  transition:
    border-color var(--transition),
    color var(--transition),
    background var(--transition);
}
.provider-profile-trigger:hover {
  border-color: var(--border-hover);
}
.provider-profile-trigger:disabled {
  color: var(--text-tertiary);
  background: #070707;
  border-color: #141414;
  cursor: not-allowed;
  opacity: 0.72;
}
.provider-profile-trigger::after {
  content: "";
  position: absolute;
  top: 50%;
  right: 14px;
  width: 7px;
  height: 7px;
  border-right: 1.6px solid currentColor;
  border-bottom: 1.6px solid currentColor;
  color: var(--text-tertiary);
  transform: translateY(-65%) rotate(45deg);
  transition: transform var(--transition), color var(--transition);
}
.provider-profile-trigger.is-open::after {
  transform: translateY(-20%) rotate(-135deg);
}
.provider-profile-trigger.is-empty {
  color: var(--text-tertiary);
}
.provider-profile-trigger:disabled::after {
  color: var(--text-quaternary);
}
.provider-profile-menu {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  right: 0;
  z-index: 30;
  padding: 6px;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: calc(var(--radius) + 2px);
  background: #0d0d0d;
  box-shadow: 0 16px 36px rgba(0,0,0,0.34);
  gap: 4px;
  max-height: 260px;
  overflow-y: auto;
}
.provider-profile-menu[hidden] {
  display: none;
}
.provider-profile-menu:not([hidden]) {
  display: grid;
}
.provider-profile-empty {
  padding: 10px 12px;
  color: var(--text-tertiary);
  font-size: 11px;
}
.provider-profile-option-row {
  display: grid;
  grid-template-columns: 22px minmax(0, 1fr);
  align-items: center;
  gap: 6px;
}
.provider-profile-delete-btn {
  width: 22px;
  height: 22px;
  padding: 0;
  border: none;
  border-radius: 999px;
  background: transparent;
  color: var(--text-quaternary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition:
    color var(--transition),
    background var(--transition);
}
.provider-profile-delete-btn:hover {
  color: #ffb7b7;
  background: rgba(229,72,77,0.14);
}
.provider-profile-delete-btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}
.provider-profile-delete-btn svg {
  width: 12px;
  height: 12px;
  display: block;
}
.provider-profile-option-btn {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid transparent;
  border-radius: var(--radius);
  background: transparent;
  color: var(--text-secondary);
  font-family: inherit;
  font-size: 11px;
  line-height: 1.35;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  cursor: pointer;
  transition:
    border-color var(--transition),
    background var(--transition),
    color var(--transition);
}
.provider-profile-option-btn:hover {
  border-color: rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.04);
  color: var(--text-primary);
}
.provider-profile-option-btn.is-active {
  border-color: rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.06);
  color: var(--text-primary);
}
.provider-profile-option-btn:disabled {
  cursor: not-allowed;
  opacity: 0.55;
}
.provider-profile-option-label {
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.provider-profile-option-tag {
  flex: 0 0 auto;
  color: var(--text-tertiary);
  font-size: 10px;
}
textarea { resize: vertical; min-height: 72px; }
input:disabled, select:disabled, textarea:disabled {
  color: var(--text-tertiary);
  background: #070707;
  border-color: #141414;
  cursor: not-allowed;
  opacity: 0.72;
}
input[type="range"] { padding: 0; background: transparent; border: none; }
input[type="range"]::-webkit-slider-runnable-track { background: var(--border); height: 4px; border-radius: 2px; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); margin-top: -5px; cursor: pointer; }
select { cursor: pointer; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row .form-group { flex: 1; min-width: 100px; }
input[type="file"] { padding: 7px; cursor: pointer; font-size: 12px; }
input[type="file"]::file-selector-button {
  background: var(--surface); color: var(--text-secondary);
  border: 1px solid var(--border); padding: 4px 10px;
  border-radius: var(--radius); cursor: pointer; margin-right: 6px;
  font-family: inherit; font-size: 11px;
  transition: border-color var(--transition);
}
input[type="file"]::file-selector-button:hover { border-color: var(--border-hover); }

/* Buttons */
.btn-primary {
  width: 100%; padding: 10px; border: none; border-radius: var(--radius);
  background: var(--accent); color: #000;
  font-size: 13px; font-weight: 600; font-family: inherit;
  cursor: pointer; transition: background var(--transition); letter-spacing: -0.01em;
}
.btn-primary:hover { background: #ccc; }
.btn-primary:disabled { background: #333 !important; color: #666; cursor: not-allowed; }
.btn-secondary {
  width: 100%; padding: 10px; border-radius: var(--radius);
  background: transparent; color: var(--text-primary);
  border: 1px solid var(--border); font-size: 13px; font-weight: 500;
  font-family: inherit; cursor: pointer; transition: all var(--transition);
}
.btn-secondary:hover { border-color: var(--border-hover); color: var(--accent); }
.btn-secondary:disabled {
  border-color: #141414;
  color: #555;
  cursor: not-allowed;
}
.button-row {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}
.button-row.compact {
  margin-top: 0;
}
.button-row.compact > * {
  flex: 1;
  width: auto;
}
.button-row.compact button {
  padding: 8px 10px;
  font-size: 11px;
}

/* Status */
.status { margin: 0 0 8px; min-height: 18px; font-size: 11px; color: var(--text-secondary); line-height: 1.45; }

/* Spinner */
.spinner {
  display: inline-block; width: 14px; height: 14px;
  border: 2px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.8s linear infinite;
  vertical-align: middle; margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Lightbox */
.lightbox {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(0,0,0,0.92);
  display: none; align-items: center; justify-content: center;
  flex-direction: column; padding: 24px;
  overflow-y: auto;
}
.lightbox.open { display: flex; }
.lightbox-wrap {
  position: relative; max-width: 90vw; max-height: 85vh;
  border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--border);
  touch-action: none;
  cursor: default;
}
.lightbox-wrap.is-zoomed { cursor: grab; }
.lightbox-wrap.is-dragging { cursor: grabbing; }
.lightbox-wrap img {
  display: block; max-width: 90vw; max-height: 85vh;
  transform-origin: center center;
  transition: transform 120ms ease;
  will-change: transform;
  user-select: none;
  -webkit-user-drag: none;
}
.lightbox-wrap.is-dragging img { transition: none; }
.lightbox-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(transparent 50%, rgba(0,0,0,0.85));
  opacity: 0; transition: opacity var(--transition);
  display: flex; flex-direction: column; justify-content: flex-end; padding: 16px;
  pointer-events: none;
}
.lightbox-wrap:hover .lightbox-overlay { opacity: 1; }
.lightbox-overlay:focus-within { opacity: 1; }
.lightbox-overlay .prompt-full {
  font-size: 13px; color: #ccc; line-height: 1.5; margin-bottom: 10px;
  max-height: 3em; overflow: hidden; cursor: pointer; transition: max-height 0.3s ease;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  pointer-events: none;
}
.lightbox-overlay .prompt-full.expanded {
  max-height: 30vh; overflow-y: auto;
  display: block; -webkit-line-clamp: unset;
}
.lightbox-meta {
  display: flex; align-items: center; justify-content: space-between;
  pointer-events: none;
}
.lightbox-wrap:hover .lightbox-overlay .prompt-full,
.lightbox-wrap:hover .lightbox-overlay .lightbox-meta,
.lightbox-overlay:focus-within .prompt-full,
.lightbox-overlay:focus-within .lightbox-meta {
  pointer-events: auto;
}
.lightbox-meta .lightbox-counter { color: var(--text-tertiary); font-size: 11px; }
.lightbox-meta .lightbox-actions { display: flex; gap: 6px; }
.lightbox-meta .lightbox-actions a, .lightbox-meta .lightbox-actions button {
  padding: 5px 14px; border-radius: var(--radius); font-size: 12px;
  font-family: inherit; cursor: pointer; text-decoration: none;
  background: rgba(255,255,255,0.15); color: #fff; border: none;
  transition: background var(--transition);
}
.lightbox-meta .lightbox-actions a:hover, .lightbox-meta .lightbox-actions button:hover { background: rgba(255,255,255,0.3); }
.lightbox-zoom-toolbar {
  position: absolute;
  top: 18px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1002;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 999px;
  background: rgba(12,12,12,0.76);
  backdrop-filter: blur(10px);
  box-shadow: 0 10px 24px rgba(0,0,0,0.28);
}
.lightbox-zoom-toolbar button {
  min-width: 32px;
  height: 30px;
  padding: 0 10px;
  border: none;
  border-radius: 999px;
  background: rgba(255,255,255,0.1);
  color: var(--text-primary);
  font-family: inherit;
  font-size: 13px;
  line-height: 1;
  cursor: pointer;
  transition: background var(--transition), color var(--transition), opacity var(--transition);
}
.lightbox-zoom-toolbar button:hover { background: rgba(255,255,255,0.22); }
.lightbox-zoom-toolbar button:disabled {
  opacity: 0.35;
  cursor: default;
}
.lightbox-zoom-value {
  min-width: 44px;
  color: var(--text-secondary);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  text-align: center;
}
.lightbox-close {
  position: absolute; top: 16px; right: 20px;
  background: none; border: none; color: var(--text-tertiary);
  font-size: 28px; cursor: pointer; line-height: 1;
  transition: color var(--transition);
}
.lightbox-close:hover { color: var(--text-primary); }
.lightbox-nav {
  position: absolute; top: 50%; transform: translateY(-50%);
  background: rgba(255,255,255,0.1); border: 1px solid var(--border);
  color: var(--text-secondary); width: 40px; height: 40px;
  border-radius: 50%; font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--transition); backdrop-filter: blur(4px);
}
.lightbox-nav:hover { background: rgba(255,255,255,0.2); color: var(--text-primary); border-color: var(--border-hover); }
.lightbox-nav:disabled { opacity: 0.2; cursor: default; pointer-events: none; }
.lightbox-nav.prev { left: 16px; }
.lightbox-nav.next { right: 16px; }
.lightbox-counter { color: var(--text-tertiary); font-size: 12px; margin-bottom: 6px; }

@media (max-width: 1040px) {
  .panel { width: 220px; min-width: 220px; }
  .panel-header-copy { max-width: 156px; }
}

/* Mobile */
@media (max-width: 560px) {
  .app { flex-direction: column; height: auto; }
  .panel { width: 100%; min-width: 0; border-right: none; border-bottom: 1px solid var(--border); }
  .gallery-area { height: auto; min-height: 50vh; padding: 18px; }
  .gallery-window-shell { min-height: 50vh; }
  .running-banner { max-height: 360px; }
  .running-banner-body { grid-template-columns: 1fr; max-height: 286px; }
  .running-job-header { flex-direction: column; align-items: stretch; }
  .running-job-actions { justify-content: flex-start; }
}

@media (prefers-reduced-motion: reduce) {
  .gallery-item {
    animation: none !important;
    transform: none !important;
    opacity: 1 !important;
  }
}

/* Drop zone */
.drop-zone {
  border: 1px dashed var(--border-hover);
  border-radius: var(--radius);
  padding: 16px;
  text-align: center;
  transition: all var(--transition);
  position: relative;
  outline: none;
  min-height: 80px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
}
.drop-zone:hover, .drop-zone:focus-within { border-color: #555; }
.drop-zone.dragover { border-color: var(--accent); background: rgba(255,255,255,0.03); }
.drop-zone-text { color: var(--text-tertiary); font-size: 12px; pointer-events: none; }
.drop-zone-browse {
  padding: 4px 12px; border-radius: var(--radius); font-size: 11px;
  font-family: inherit; cursor: pointer;
  border: 1px solid var(--border); background: transparent;
  color: var(--text-secondary); transition: all var(--transition);
}
.drop-zone-browse:hover { border-color: var(--border-hover); color: var(--text-primary); }
.drop-zone-preview {
  display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
}
.drop-zone-preview .thumb-wrap {
  position: relative; display: inline-block;
}
.drop-zone-preview img {
  height: 48px; border-radius: 4px; border: 1px solid var(--border);
}
.drop-zone-preview .thumb-remove {
  position: absolute; top: -4px; right: -4px;
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--danger); color: #fff; border: none;
  font-size: 10px; line-height: 16px; text-align: center;
  cursor: pointer; padding: 0;
}

/* Settings panel */
.settings-wrap { position: relative; }
.settings-toggle {
  width: 32px; height: 32px; border-radius: var(--radius);
  border: 1px solid var(--border); background: transparent;
  color: var(--text-secondary); font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--transition);
}
.settings-toggle:hover { border-color: var(--border-hover); color: var(--text-primary); }
.settings-panel {
  display: none; position: absolute; top: 100%; right: 0; margin-top: 6px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 6px; min-width: 140px;
  z-index: 50; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}
.settings-panel.open { display: flex; flex-direction: column; }
.settings-panel button {
  padding: 7px 12px; border: none; background: transparent;
  color: var(--text-secondary); font-size: 12px; font-family: inherit;
  cursor: pointer; border-radius: var(--radius); text-align: left;
  transition: all var(--transition);
}
.settings-panel button:hover { background: rgba(255,255,255,0.06); color: var(--text-primary); }
.settings-panel button.danger { color: var(--danger); }
.settings-panel button.danger:hover { background: #e5484d15; }
.settings-panel hr {
  border: none; border-top: 1px solid var(--border); margin: 4px 0;
}
.settings-info {
  padding: 5px 12px; font-size: 11px; color: var(--text-tertiary);
}

/* Running banner */
.running-banner {
  margin-bottom: 12px;
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: var(--radius-lg);
  background: #050505;
  overflow: hidden;
  transform-origin: top;
  transition: opacity 180ms ease, transform 180ms ease, max-height 220ms ease, margin 180ms ease, border-color 180ms ease;
  max-height: min(34vh, 330px);
  opacity: 1;
  transform: translateY(0);
}
.running-banner.is-empty {
  max-height: 0; opacity: 0; transform: translateY(-8px); margin-bottom: 0; pointer-events: none;
}
.running-banner.is-collapsed { max-height: 38px; }
.running-banner-toggle {
  width: 100%; min-height: 38px; border: none; background: transparent; color: var(--text-primary);
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  padding: 9px 12px; font: inherit; cursor: pointer; text-align: left;
}
.running-banner-title { display: flex; align-items: center; gap: 8px; min-width: 0; }
.running-dot { width: 7px; height: 7px; border-radius: 50%; background: #8fc8ff; animation: pulse-dot 1.5s ease-in-out infinite; }
.running-title-text { font-size: 12px; font-weight: 600; white-space: nowrap; }
.running-subtitle { color: var(--text-tertiary); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.running-banner-meta { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.running-banner-count { color: var(--text-secondary); font-size: 10px; padding: 3px 8px; border-radius: 999px; background: rgba(255,255,255,0.04); }
.running-chevron { color: var(--text-tertiary); font-size: 12px; transition: transform 180ms ease; }
.running-banner.is-collapsed .running-chevron { transform: rotate(-90deg); }
.running-banner-body {
  padding: 0 10px 10px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 8px;
  max-height: min(26vh, 246px);
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-gutter: stable;
  align-items: start;
  transition: opacity 160ms ease, transform 160ms ease;
}
.running-banner.is-collapsed .running-banner-body { opacity: 0; transform: translateY(-6px); pointer-events: none; }
.running-job-card {
  min-width: 0;
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 8px;
  padding: 9px;
  background: rgba(255,255,255,0.025);
  display: grid;
  gap: 8px;
  min-height: 112px;
}
.running-job-card.is-running { border-color: rgba(143,200,255,0.24); }
.running-job-card.is-queued { border-color: rgba(255,255,255,0.12); }
.running-job-card.is-canceling { border-color: rgba(229,72,77,0.28); }
.running-job-card.is-running .running-job-status { color: #d7ecff; background: rgba(91,160,255,0.16); }
.running-job-card.is-queued .running-job-status { color: var(--text-secondary); background: rgba(255,255,255,0.07); }
.running-job-card.is-canceling .running-job-status { color: #ffd6d6; background: rgba(229,72,77,0.18); }
.running-job-card.is-running .running-job-progress-fill { background: rgba(143,200,255,0.92); }
.running-job-card.is-canceling .running-job-progress-fill { background: rgba(229,72,77,0.82); }
.running-job-card.is-queued .running-job-progress-fill { background: rgba(255,255,255,0.34); }
.running-job-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}
.running-job-main {
  min-width: 0;
  display: grid;
  gap: 5px;
}
.running-job-top {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.running-job-status { color: #d7ecff; font-size: 10px; padding: 2px 6px; border-radius: 999px; background: rgba(91,160,255,0.16); white-space: nowrap; }
.running-job-type {
  color: var(--text-secondary);
  font-size: 10px;
  padding: 2px 5px;
  border-radius: 999px;
  background: rgba(255,255,255,0.04);
}
.running-job-prompt {
  color: var(--text-primary);
  font-size: 11px;
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  min-height: 28px;
}
.running-job-progress-block {
  display: grid;
  gap: 6px;
  min-width: 0;
  padding: 0;
  background: transparent;
}
.running-job-stats {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 6px;
}
.running-job-stat {
  min-width: 0;
  padding: 5px 6px;
  border: 1px solid rgba(255,255,255,0.055);
  border-radius: var(--radius);
  background: rgba(255,255,255,0.025);
}
.running-job-stat-label {
  color: var(--text-tertiary);
  font-size: 9px;
  line-height: 1.15;
}
.running-job-stat-value {
  margin-top: 2px;
  color: var(--text-secondary);
  font-size: 11px;
  line-height: 1.2;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.running-job-progress-track {
  position: relative;
  width: 100%;
  height: 4px;
  border-radius: 999px;
  overflow: hidden;
  background: rgba(255,255,255,0.08);
}
.running-job-progress-fill {
  height: 100%;
  width: 0;
  border-radius: inherit;
  background: rgba(143,200,255,0.92);
  transition: width 180ms ease;
}
.running-job-progress-note {
  min-height: 0;
  color: var(--text-secondary);
  font-size: 10px;
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.running-job-actions { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; flex-shrink: 0; }
.running-job-actions button {
  height: 24px; padding: 0 8px; border-radius: var(--radius); border: 1px solid rgba(255,255,255,0.07); background: rgba(255,255,255,0.04);
  color: var(--text-secondary); font-family: inherit; font-size: 10px; cursor: pointer;
}
.running-job-actions button:hover { border-color: rgba(255,255,255,0.16); background: rgba(255,255,255,0.08); color: var(--text-primary); }
@keyframes pulse-dot { 0%, 100% { opacity: .45; transform: scale(.88); } 50% { opacity: 1; transform: scale(1.12); } }

/* Left task list */
.task-panel {
  margin-top: 10px;
  flex-shrink: 0;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: #000; overflow: hidden;
}
.task-panel-header {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px;
  padding: 8px 9px;
  cursor: pointer;
  user-select: none;
  list-style: none;
}
.task-panel-header::-webkit-details-marker { display: none; }
.task-panel-heading {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.task-panel-title { font-size: 11px; font-weight: 600; color: var(--text-secondary); }
.task-panel-preview {
  color: var(--text-tertiary);
  font-size: 10px;
  line-height: 1.35;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.task-panel-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}
.task-panel-count { font-size: 10px; color: var(--text-tertiary); }
.task-panel-chevron {
  color: var(--text-tertiary);
  font-size: 12px;
  transition: transform 180ms ease;
}
.task-panel[open] .task-panel-chevron { transform: rotate(180deg); }
.task-panel-body {
  border-top: 1px solid var(--border);
  max-height: 0;
  overflow: hidden;
  transition: max-height 180ms ease;
}
.task-panel[open] .task-panel-body { max-height: 280px; }
.task-list {
  overflow-y: auto;
  padding: 7px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 279px;
}
.task-empty {
  flex: 1; min-height: 116px; display: flex; align-items: center; justify-content: center;
  color: var(--text-tertiary); font-size: 11px; text-align: center;
}
.left-task-card {
  border: 1px solid var(--border); border-radius: var(--radius); padding: 8px;
  background: rgba(255,255,255,0.025);
}
.left-task-card.is-running,
.left-task-card.is-queued,
.left-task-card.is-canceling { border-color: rgba(91,160,255,0.28); }
.left-task-card.is-failed,
.left-task-card.is-canceled { border-color: rgba(229,72,77,0.35); }
.left-task-card.is-completed { border-color: rgba(69,165,87,0.24); }
.left-task-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 5px; }
.left-task-type { font-size: 10px; color: var(--text-primary); font-weight: 600; }
.left-task-badge {
  padding: 2px 6px; border-radius: 999px; font-size: 9px;
  color: var(--text-secondary); background: rgba(255,255,255,0.08); white-space: nowrap;
}
.left-task-badge.running,
.left-task-badge.queued,
.left-task-badge.canceling { color: #d7ecff; background: rgba(91,160,255,0.18); }
.left-task-badge.completed { color: #d6f6dd; background: rgba(69,165,87,0.18); }
.left-task-badge.partial { color: #ffe6b5; background: rgba(199,146,23,0.18); }
.left-task-badge.failed,
.left-task-badge.canceled { color: #ffd6d6; background: rgba(229,72,77,0.2); }
.left-task-prompt {
  color: var(--text-secondary); font-size: 10px; line-height: 1.35;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.left-task-message {
  margin-top: 5px; color: var(--text-tertiary); font-size: 9px; line-height: 1.35;
  white-space: pre-line;
  overflow: hidden;
}
.left-task-meta { margin-top: 6px; color: var(--text-tertiary); font-size: 9px; display: flex; justify-content: space-between; gap: 8px; }
.left-task-actions { display: flex; gap: 5px; margin-top: 7px; }
.left-task-actions button {
  flex: 1; padding: 4px 6px; border-radius: var(--radius); font-size: 9px;
  border: 1px solid var(--border); background: transparent; color: var(--text-secondary);
  font-family: inherit; cursor: pointer;
}
.left-task-actions button:hover { border-color: var(--border-hover); color: var(--text-primary); }

.prompt-bank-empty {
  min-height: 156px;
  padding: 12px;
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  color: var(--text-tertiary);
  font-size: 12px;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
}
.prompt-bank-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: clamp(220px, 38vh, 420px);
  overflow-y: auto;
  overscroll-behavior: contain;
  padding-right: 4px;
}
.prompt-bank-item {
  flex: 0 0 auto;
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
}
.prompt-bank-item .prompt-text {
  font-size: 12px;
  color: var(--text-primary);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.prompt-bank-item .prompt-meta {
  margin-top: 6px;
  font-size: 10px;
  color: var(--text-tertiary);
}
.prompt-bank-actions {
  display: flex;
  gap: 6px;
  margin-top: 8px;
}
.prompt-bank-actions button {
  padding: 4px 10px;
  border-radius: var(--radius);
  font-size: 11px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  font-family: inherit;
  transition: all var(--transition);
}
.prompt-bank-actions button:hover {
  border-color: var(--border-hover);
  color: var(--text-primary);
}
.gallery-item[data-open-lightbox] img[data-src] {
  background: #060606;
}
.failure-popup {
  position: fixed;
  top: 18px;
  left: 50%;
  width: min(540px, calc(100vw - 32px));
  transform: translate(-50%, -20px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 220ms ease, transform 320ms var(--panel-ease);
  z-index: 980;
}
.failure-popup.open {
  transform: translate(-50%, 0);
  opacity: 1;
  pointer-events: auto;
}
.failure-popup-card {
  border: 1px solid rgba(229,72,77,0.28);
  border-radius: var(--radius-lg);
  background:
    radial-gradient(circle at top right, rgba(229,72,77,0.08), transparent 34%),
    linear-gradient(180deg, rgba(16,8,8,0.98), rgba(10,10,10,0.98));
  box-shadow: 0 20px 40px rgba(0,0,0,0.42);
  padding: 14px;
}
.failure-popup-title {
  font-size: 13px;
  font-weight: 600;
  color: #ffd6d6;
}
.failure-popup-prompt {
  margin-top: 8px;
  color: var(--text-secondary);
  font-size: 11px;
  line-height: 1.45;
}
.failure-popup-content {
  margin-top: 10px;
  padding: 10px;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: var(--radius);
  background: rgba(255,255,255,0.02);
  color: var(--text-secondary);
  font-size: 11px;
  line-height: 1.5;
  white-space: pre-line;
}
.failure-popup-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 12px;
}
.failure-popup-actions button {
  min-width: 78px;
  padding: 8px 14px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.04);
  color: var(--text-primary);
  font: inherit;
  cursor: pointer;
  transition: all var(--transition);
}
.failure-popup-actions button:hover {
  border-color: var(--border-hover);
  background: rgba(255,255,255,0.08);
}
.failure-popup-actions .failure-popup-retry {
  border-color: rgba(255,255,255,0.16);
  background: rgba(255,255,255,0.02);
}
.failure-popup-actions .failure-popup-retry:hover {
  border-color: var(--border-hover);
}
.failure-popup-actions .failure-popup-delete {
  border-color: rgba(229,72,77,0.4);
  color: #ffd6d6;
  background: rgba(229,72,77,0.08);
}
.failure-popup-actions .failure-popup-delete:hover {
  border-color: rgba(229,72,77,0.65);
  background: rgba(229,72,77,0.14);
}
.failure-popup-actions button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
</style>
</head>
<body>
<div class="app">
  <!-- Left Panel -->
  <div class="panel" id="workspacePanel">
    <div class="panel-inner">
      <div class="panel-header">
        <div class="panel-header-copy">
          <h1>SCimage</h1>
        </div>
        <button type="button" class="panel-toggle" id="panelToggleBtn" aria-label="收起左侧工作区" title="收起左侧工作区">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M14 6 8 12l6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <div class="panel-body">
        <details class="connection-card" id="providerConfigCard">
          <summary>提供方配置</summary>
          <div class="connection-card-body">
            <div class="form-group">
              <label for="providerProfileSelect">快速切换</label>
              <div class="provider-profile-picker">
                <button
                  type="button"
                  id="providerProfileSelect"
                  class="provider-profile-trigger is-empty"
                  aria-haspopup="listbox"
                  aria-expanded="false"
                  aria-controls="providerProfileMenu"
                >未保存任何配置</button>
                <div id="providerProfileMenu" class="provider-profile-menu" role="listbox" hidden></div>
              </div>
            </div>
            <div class="form-group">
              <label for="providerProfileName">配置名称 <span class="hint">（保存和另存为都会用到）</span></label>
              <input type="text" id="providerProfileName" placeholder="例如：当前提供方 / 备用节点">
            </div>
            <div class="form-group">
              <label for="baseUrl">Base URL <span class="hint">（OpenAI-compatible 接口）</span></label>
              <input type="text" id="baseUrl" placeholder="https://api.openai.com/v1">
            </div>
            <div class="form-group">
              <label for="apiKey">API Key <span class="hint">（留空则保持当前已保存密钥）</span></label>
              <div class="input-with-action">
                <input type="password" id="apiKey" placeholder="输入 API Key">
                <button
                  type="button"
                  id="toggleApiKeyVisibilityBtn"
                  class="input-action-btn"
                  aria-label="显示 API Key"
                  title="显示 API Key"
                >
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M2 12C4.6 7.8 8 5.7 12 5.7c4 0 7.4 2.1 10 6.3-2.6 4.2-6 6.3-10 6.3-4 0-7.4-2.1-10-6.3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                    <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/>
                    <path class="eye-off-line" d="M4 20 20 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                  </svg>
                </button>
              </div>
            </div>
            <div class="form-group">
              <div class="field-label-row">
                <label for="model">模型</label>
                <button
                  type="button"
                  id="modelReloadBtn"
                  class="field-label-icon-btn"
                  aria-label="拉取模型"
                  title="拉取模型"
                >
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M20 11A8.1 8.1 0 0 0 4.5 9" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M4 5v4h4" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M4 13A8.1 8.1 0 0 0 19.5 15" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M20 19v-4h-4" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </button>
              </div>
              <select id="model" aria-describedby="modelStatusHint">
                <option value="" selected disabled>请选择 API 支持的模型</option>
              </select>
              <div id="modelStatusHint" class="field-hint" aria-live="polite"></div>
            </div>
            <div class="form-group">
              <label for="providerCompatProfile">兼容模式</label>
              <select id="providerCompatProfile"></select>
            </div>
            <div class="button-row">
              <button type="button" onclick="saveProviderProfile()" id="saveProviderBtn" class="btn-secondary">保存当前配置</button>
              <button type="button" onclick="saveAsProviderProfile()" id="saveAsProviderBtn" class="btn-secondary">另存为新配置</button>
            </div>
          </div>
        </details>

        <section class="workspace-shell" aria-labelledby="workspaceTitle">
          <div class="workflow-tabs" id="workflowTabs" role="tablist" aria-label="工作流切换">
            <button type="button" class="workflow-tab active" data-workflow="generate" role="tab" aria-selected="true">文生图</button>
            <button type="button" class="workflow-tab" data-workflow="image-to-image" role="tab" aria-selected="false">图生图</button>
          </div>

          <section class="workspace-card">
            <div class="workspace-card-head">
              <div class="workspace-card-copy">
                <div class="workspace-eyebrow">左侧工作区</div>
                <h2 id="workspaceTitle" class="workspace-title">文生图</h2>
              </div>
              <span id="workspaceModeChip" class="workspace-chip is-live">已接入</span>
            </div>

            <div class="workspace-stack">
              <section class="workspace-group mode-hidden" data-workflow-scope="image-to-image">
                <div class="workspace-group-head">
                  <div>
                    <div id="sourceTitle" class="workspace-group-title">参考图</div>
                    <div id="sourceHint" class="workspace-group-hint">支持拖拽、粘贴或选择多张图片作为参考。</div>
                  </div>
                </div>
                <div class="drop-zone" id="sourceDropZone" tabindex="0" aria-label="参考图上传区域">
                  <div class="drop-zone-text" id="sourceDropText">将多张参考图拖到这里，或粘贴到工作区</div>
                  <div class="drop-zone-preview" id="sourcePreview"></div>
                  <input type="file" id="sourceImage" accept="image/*" multiple style="display:none;">
                  <button type="button" class="drop-zone-browse" id="sourceBrowseBtn">选择多张参考图</button>
                </div>
              </section>

              <section class="workspace-group">
                <div class="workspace-group-head">
                  <div>
                    <div class="workspace-group-title">提示词</div>
                    <div id="promptSectionHint" class="workspace-group-hint">直接描述你想生成的画面、风格和细节。</div>
                  </div>
                  <button type="button" id="togglePromptBankBtn" class="chip-btn" aria-expanded="false">词库</button>
                </div>
                <textarea id="prompt" placeholder="一只在星空下奔跑的白色柴犬，水彩风格"></textarea>

                <details class="inline-drawer" id="promptBankPanel">
                  <summary>
                    <span>已保存提示词</span>
                    <span id="promptBankCount" class="workspace-inline-hint">0 条</span>
                  </summary>
                  <div class="inline-drawer-body">
                    <div class="button-row compact">
                      <button type="button" id="savePromptBtn" class="btn-secondary">保存当前提示词</button>
                      <button type="button" id="clearPromptBankBtn" class="btn-secondary">清空词库</button>
                    </div>
                    <div id="savedPrompts" class="prompt-bank-empty">还没有保存的提示词</div>
                  </div>
                </details>
              </section>

              <section class="workspace-group">
                <div class="workspace-group-head">
                  <div>
                    <div class="workspace-group-title">输出参数</div>
                    <div class="workspace-group-hint">当前工作流独立保存这一组输出参数，尺寸使用标准像素预设。</div>
                  </div>
                </div>
                <div class="row">
                  <div class="form-group">
                    <label for="size">尺寸</label>
                    <select id="size"></select>
                  </div>
                  <div class="form-group">
                    <label for="quality">质量</label>
                    <select id="quality"></select>
                  </div>
                </div>
                <div class="row">
                  <div class="form-group">
                    <label for="count">数量</label>
                    <select id="count">
                      <option value="1">1</option>
                      <option value="2">2</option>
                      <option value="3">3</option>
                      <option value="4">4</option>
                      <option value="5">5</option>
                      <option value="6">6</option>
                    </select>
                  </div>
                  <div class="form-group">
                    <label>输出格式</label>
                    <div class="helper-note">当前固定输出 PNG，格式与压缩选项后续再开放。</div>
                  </div>
                </div>
              </section>

              <section class="workspace-group">
                <div class="workspace-group-head">
                  <div class="workspace-group-title">执行</div>
                </div>
                <div id="status" class="status"></div>
                <div class="button-row">
                  <button type="button" id="generateBtn" class="btn-primary">生成图片</button>
                </div>
              </section>
            </div>
          </section>

          <details class="task-panel" id="taskPanel">
            <summary class="task-panel-header">
              <span class="task-panel-heading">
                <span id="taskPanelTitle" class="task-panel-title">最近任务</span>
                <span id="taskPanelPreview" class="task-panel-preview">暂无任务</span>
              </span>
              <span class="task-panel-meta">
                <span id="taskPanelCount" class="task-panel-count">0 个任务</span>
                <span class="task-panel-chevron">⌄</span>
              </span>
            </summary>
            <div class="task-panel-body">
              <div id="taskList" class="task-list"></div>
            </div>
          </details>
        </section>
      </div>
    </div>
  </div>

  <!-- Right: Gallery -->
  <div class="gallery-area">
    <div class="gallery-header">
      <div class="gallery-header-left">
        <span class="gallery-count" id="galleryCount"></span>
        <span id="fsDirStatus" style="display:none; color:var(--text-tertiary); font-size:11px;"></span>
      </div>
      <div class="gallery-actions-right">
        <div class="gallery-filter">
          <button class="active" onclick="filterGallery('all', this)">全部</button>
          <button onclick="filterGallery('tasks', this)">任务</button>
        </div>
        <button class="gallery-sort-btn" id="sortBtn" onclick="toggleSort()" title="排序">新→旧 ↓</button>
        <div class="settings-wrap">
          <button class="settings-toggle" onclick="toggleSettingsPanel()" aria-label="设置">&#9881;</button>
          <div class="settings-panel" id="settingsPanel">
            <span class="settings-info" id="storageMode">当前配置：载入中</span>
            <span class="settings-info" id="storageUsage">同步：自动刷新</span>
            <button onclick="refreshGallery()">刷新</button>
            <button onclick="cleanupEmptyGeneratedDirs()" id="cleanupGeneratedBtn">清理空文件夹</button>
            <button onclick="clearSavedPrompts()">清空提示词</button>
            <hr>
            <button class="danger" onclick="resetFormState()">重置表单</button>
          </div>
        </div>
      </div>
    </div>
    <section id="runningBanner" class="running-banner is-empty" aria-live="polite">
      <button id="runningBannerToggle" class="running-banner-toggle" type="button" aria-expanded="true">
        <span class="running-banner-title">
          <span class="running-dot"></span>
          <span class="running-title-text">正在运行的任务</span>
          <span id="runningBannerSubtitle" class="running-subtitle">暂无运行中任务</span>
        </span>
        <span class="running-banner-meta">
          <span id="runningBannerCount" class="running-banner-count">0 个</span>
          <span class="running-chevron">⌄</span>
        </span>
      </button>
      <div id="runningBannerBody" class="running-banner-body"></div>
    </section>
    <div id="galleryWindowShell" class="gallery-window-shell">
      <div id="galleryWindow" class="gallery-window">
        <div class="gallery-viewport-content">
          <div id="galleryGrid" class="gallery-grid"></div>
          <div id="galleryEmpty" class="gallery-empty">还没有图片</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="failurePopup" class="failure-popup" aria-live="assertive">
  <div class="failure-popup-card">
    <div class="failure-popup-title">任务失败</div>
    <div id="failurePopupPrompt" class="failure-popup-prompt"></div>
    <div id="failurePopupContent" class="failure-popup-content"></div>
    <div class="failure-popup-actions">
      <button type="button" id="failurePopupRetry" class="failure-popup-retry">重试</button>
      <button type="button" id="failurePopupDelete" class="failure-popup-delete">删除任务</button>
      <button type="button" id="failurePopupConfirm">确定</button>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="if(event.target===this)closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
  <div class="lightbox-zoom-toolbar" aria-label="图片缩放工具">
    <button type="button" id="lightboxZoomOut" aria-label="缩小图片" title="缩小">−</button>
    <span class="lightbox-zoom-value" id="lightboxZoomValue" aria-live="polite">100%</span>
    <button type="button" id="lightboxZoomIn" aria-label="放大图片" title="放大">+</button>
    <button type="button" id="lightboxZoomReset" aria-label="重置图片缩放" title="重置">1:1</button>
  </div>
  <button class="lightbox-nav prev" id="lightboxPrev" onclick="lightboxNav(-1)" aria-label="上一张">&#8249;</button>
  <button class="lightbox-nav next" id="lightboxNext" onclick="lightboxNav(1)" aria-label="下一张">&#8250;</button>
  <div class="lightbox-wrap">
    <img id="lightboxImg" src="" alt="">
    <div class="lightbox-overlay">
      <div class="prompt-full" id="lightboxPrompt" onclick="event.stopPropagation();this.classList.toggle('expanded')"></div>
      <div class="lightbox-meta">
        <span class="lightbox-counter" id="lightboxCounter"></span>
        <div class="lightbox-actions">
          <button onclick="event.stopPropagation();copyPrompt()" id="lightboxCopy">复制提示词</button>
          <button onclick="event.stopPropagation();addLightboxImageToSource()" id="lightboxAddSource">作参考图</button>
          <a id="lightboxDl" href="" download="" onclick="event.stopPropagation()">下载</a>
          <button onclick="event.stopPropagation();deleteLightboxImage()" id="lightboxDel" class="lightbox-del-btn">删除</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/source-image-store.js"></script>

<script src="/workflow-state.js"></script>
<script src="/workspace-panel.js"></script>
<script src="/gallery-runtime.js"></script>
<script src="/provider-model-picker.js"></script>
<script src="/provider-profile-picker.js"></script>
<script src="/app.js"></script>
</body>
