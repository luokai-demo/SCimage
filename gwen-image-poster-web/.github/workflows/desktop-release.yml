name: SCimage Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: scimage-desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            runner: windows-latest
            target: windows
            artifact_name: SCimage-windows
            release_asset: SCimage-windows.zip
          - label: macOS
            runner: macos-13
            target: macos
            artifact_name: SCimage-macos
            release_asset: SCimage-macos.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Run tests
        shell: bash
        run: python -m unittest discover -s tests

      - name: Build desktop bundle
        shell: bash
        run: python scripts/build_desktop.py --target "${{ matrix.target }}"

      - name: Package Windows artifact
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/windows/SCimage" -DestinationPath "dist/windows/${{ matrix.release_asset }}" -Force

      - name: Package macOS artifact
        if: matrix.target == 'macos'
        shell: bash
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/macos/SCimage.app" "dist/macos/${{ matrix.release_asset }}"

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.target }}/${{ matrix.release_asset }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download built assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/SCimage-windows/SCimage-windows.zip
            release-assets/SCimage-macos/SCimage-macos.zip
